<!doctype html>
<!-- Plays a theme the way the app does (same layout and motion rules as Kit/ThemeScene.Art.cs), for checking paintings and motion.
     preview.html?key=koi&w=1280&h=720&t=3  →  window.renderAt(seconds) moves everything to that moment. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background-repeat:no-repeat}
.e{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform}
.e img,.e div{position:absolute;inset:0;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none}
</style></head><body><div id="stage"><div id="ui"></div></div>
<script>
const q = new URLSearchParams(location.search);
const key = q.get('key'), Wv = +q.get('w') || 1280, Hv = +q.get('h') || 720;
const base = '../../src/Shabpa/Assets/themes/';
const stage = document.getElementById('stage');
stage.style.width = Wv + 'px'; stage.style.height = Hv + 'px';

function rng(seed) { let a = seed >>> 0; return (lo = 0, hi = 1) => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return lo + (((t ^ (t >>> 14)) >>> 0) / 4294967296) * (hi - lo); }; }
const frac = (x) => x - Math.floor(x);
const sine = (s) => (1 - Math.cos(Math.PI * s)) / 2;
// WPF: From→To with AutoReverse and a SineEase(InOut), started part-way through (phase of the whole there-and-back)
const swing = (t, dur, phase, lo, hi) => { const u = frac(t / (2 * dur) + phase); const s = u < .5 ? u * 2 : 2 - u * 2; return lo + (hi - lo) * sine(s); };
const keys = (u, frames) => { // linear key frames over 0..1
  if (u <= frames[0][0]) return frames[0][1];
  for (let i = 1; i < frames.length; i++) if (u <= frames[i][0]) { const [a, va] = frames[i - 1], [b, vb] = frames[i]; return b === a ? vb : va + (vb - va) * (u - a) / (b - a); }
  return frames[frames.length - 1][1];
};

let ents = [], spec;
window.ready = fetch(base + 'scenes.json').then((r) => r.json()).then((all) => {
  spec = all[key];
  const s = Math.max(Wv / spec.w, Hv / spec.h), ox = (Wv - spec.w * s) * spec.ax, oy = (Hv - spec.h * s) * spec.ay;
  stage.style.backgroundImage = `url(${base + key}.jpg)`;
  stage.style.backgroundSize = `${spec.w * s}px ${spec.h * s}px`;
  stage.style.backgroundPosition = `${ox}px ${oy}px`;
  const Rr = (R, v, d) => v == null ? d : Array.isArray(v) ? R(v[0], v[1]) : v;
  spec.layers.forEach((L, li) => {
    const R = rng(li * 7919 + 17);
    const at = L.at || (L.grid ? (() => { const g = L.grid, p = []; for (let r = 0; r < g.rows; r++) for (let c = 0; c < g.cols; c++) p.push([g.x + c * g.dx, g.y + r * g.dy]); return p; })() : null);
    const n = at ? at.length : L.n;
    for (let i = 0; i < n; i++) {
      const frames = [].concat(L.sprite);
      const isRect = frames[0].startsWith('#');
      const [sw, sh] = isRect ? (L.rect || [spec.w, spec.h]) : spec.sprites[frames[0]];
      const w = isRect ? sw : Rr(R, L.size, sw), h = w * sh / sw;
      const e = { L, w, h, s, ox, oy };
      e.px = at ? at[i][0] : Rr(R, L.x, R()) * spec.w; e.py = at ? at[i][1] : Rr(R, L.y, R()) * spec.h;
      if (isRect && !at && !L.x) { e.px = spec.w / 2; e.py = spec.h / 2; }
      e.rot = Rr(R, L.rot, 0); e.flip = L.flip === 'random' ? (R() < .5 ? -1 : 1) : L.flip ? -1 : 1;
      e.op = Rr(R, L.op, 1);
      const ph = () => L.phase != null ? frac(L.phase + i * (L.phaseStep || 0)) : R();
      if (L.move) { e.mph = ph(); e.mdur = Rr(R, L.move.dur, 10); e.dx = Rr(R, L.move.dx, 0); e.dy = Rr(R, L.move.dy, 0); }
      if (L.fade && !L.move) { e.fph = ph(); e.fdur = Rr(R, L.fadeDur, 6); }
      if (L.sway) { e.sx = Rr(R, L.sway.x, 0); e.sy = Rr(R, L.sway.y, 0); e.sdx = Rr(R, L.sway.dur, 5); e.sdy = L.sway.dury ? Rr(R, L.sway.dury, 5) : e.sdx; e.sphx = ph(); e.sphy = L.sway.dury ? ph() : e.sphx; }
      if (L.twinkle) { e.tdur = Rr(R, L.twinkle.dur, 3); e.tph = ph(); }
      if (L.spin) { e.sdeg = Rr(R, L.spin.deg, 360) * (L.spin.either && R() < .5 ? -1 : 1); e.spdur = Rr(R, L.spin.dur, 20); e.spph = ph(); }
      if (L.pulse) { e.pdur = Rr(R, L.pulse.dur, 4); e.pph = ph(); }
      if (L.wag) { e.wdeg = Rr(R, L.wag.deg, 5); e.wdur = Rr(R, L.wag.dur, 1); e.wph = ph(); }
      if (L.path) {
        const P = L.path; e.pcx = Rr(R, P.cx, spec.w / 2); e.pcy = Rr(R, P.cy, spec.h / 2); e.prx = Rr(R, P.rx, 200); e.pry = Rr(R, P.ry, 120);
        e.pdir = P.dir || (R() < .5 ? -1 : 1); e.pathDur = Rr(R, P.dur, 30); e.paph = ph(); e.wob = Rr(R, P.wob, 0); e.lobes = P.lobes || 3; e.wph0 = R(0, Math.PI * 2);
        // the same key frames the app builds: positions along the loop and the heading toward the next one
        const steps = P.steps || 72; e.kf = [];
        const pt = (u) => { const a = u * Math.PI * 2 * e.pdir, m = 1 + e.wob * Math.sin(e.lobes * a + e.wph0); return [e.pcx + e.prx * m * Math.cos(a), e.pcy + e.pry * m * Math.sin(a)]; };
        let prev = null;
        for (let k = 0; k <= steps; k++) {
          const u = k / steps, [x, y] = pt(u), [x2, y2] = pt(u + .5 / steps), [x0, y0] = pt(u - .5 / steps);
          let ang = Math.atan2(y2 - y0, x2 - x0) * 180 / Math.PI;
          if (prev != null) { while (ang - prev > 180) ang -= 360; while (ang - prev < -180) ang += 360; }
          prev = ang; e.kf.push([u, x, y, ang]);
        }
      }
      if (frames.length > 1) { e.fps = (L.frames && L.frames.fps) || 2; e.frph = ph(); }
      const div = document.createElement('div'); div.className = 'e';
      div.style.width = w * s + 'px'; div.style.height = h * s + 'px';
      if (L.origin) div.style.transformOrigin = `${L.origin[0] * 100}% ${L.origin[1] * 100}%`;
      e.imgs = frames.map((nm) => { if (isRect) { const d = document.createElement('div'); d.style.background = nm; div.appendChild(d); return d; } const im = new Image(); im.src = `${base + key}.${nm}.png`; div.appendChild(im); return im; });
      stage.insertBefore(div, document.getElementById('ui'));
      e.div = div; ents.push(e);
    }
  });
  return Promise.all(ents.flatMap((e) => e.imgs.filter((i) => i.decode).map((i) => i.decode().catch(() => 0))));
});

window.renderAt = (t) => {
  for (const e of ents) {
    const L = e.L;
    let x = e.px, y = e.py, rot = e.rot, sc = 1, op = e.op, tw = 1;
    if (L.move) {
      const u = frac(t / e.mdur + e.mph), tr = L.move.travel || 1;
      let p = Math.min(u / tr, 1); if (L.move.ease === 'in') p = p * p; if (L.move.ease === 'out') p = 1 - (1 - p) * (1 - p);
      x += e.dx * p; y += e.dy * p;
      if (L.fade) op *= keys(u, L.fade);
      if (L.grow) sc *= L.grow[0] + (L.grow[1] - L.grow[0]) * u;
    } else if (L.fade) op *= keys(frac(t / e.fdur + e.fph), L.fade);
    if (L.sway) { x += e.sx ? swing(t, e.sdx, e.sphx, -e.sx, e.sx) : 0; y += e.sy ? swing(t, e.sdy, e.sphy, -e.sy, e.sy) : 0; }
    if (L.twinkle) tw = swing(t, e.tdur, e.tph, L.twinkle.lo, L.twinkle.hi);
    if (L.spin) rot += L.spin.back ? swing(t, e.spdur, e.spph, -e.sdeg, e.sdeg) : e.sdeg * frac(t / e.spdur + e.spph);
    if (L.pulse) sc *= swing(t, e.pdur, e.pph, L.pulse.lo, L.pulse.hi);
    if (L.wag) rot += swing(t, e.wdur, e.wph, -e.wdeg, e.wdeg);
    if (L.path) {
      const u = frac(t / e.pathDur + e.paph); let k = 1; while (k < e.kf.length - 1 && e.kf[k][0] < u) k++;
      const a = e.kf[k - 1], b = e.kf[k], m = (u - a[0]) / (b[0] - a[0]);
      x = a[1] + (b[1] - a[1]) * m + (x - e.px); y = a[2] + (b[2] - a[2]) * m + (y - e.py);
      if (L.path.face !== false) rot += a[3] + (b[3] - a[3]) * m;
    }
    const s = e.s, X = e.ox + x * s - e.w * s / 2, Y = e.oy + y * s - e.h * s / 2;
    const tilt = L.tilt ? `rotate(${L.tilt.rot || 0}deg) scale(1,${L.tilt.squash || 1}) ` : '';
    e.div.style.transform = `translate(${X}px,${Y}px) ${tilt}rotate(${rot}deg) scale(${e.flip * sc},${sc * (L.squash || 1)})`;
    e.div.style.opacity = op;
    if (e.imgs.length > 1) { const k = Math.floor(t * e.fps + e.frph * e.imgs.length) % e.imgs.length; e.imgs.forEach((im, j) => im.style.opacity = j === k ? tw : 0); }
    else e.imgs[0].style.opacity = tw;
  }
};
// optional: the store's mock-up of the window on top (?ui=1)
if (q.get('ui')) document.getElementById('ui').innerHTML = `<div style="position:absolute;right:0;top:0;bottom:0;width:20%;background:rgba(0,0,0,.35)"></div>
<div style="position:absolute;left:4%;right:24%;top:10%;height:38%;border-radius:8px;background:rgba(40,20,30,.82)"></div>
<div style="position:absolute;left:4%;right:24%;top:52%;bottom:8%;border-radius:8px;background:rgba(20,20,30,.78);border:1px solid rgba(255,255,255,.15)"></div>`;
</script></body></html>
