name: Release build

# Builds the installer from the public source on a GitHub-hosted runner, so the file can be
# verified (and later signed by SignPath) as coming straight from this repository.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['ci/release-build']

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build installer
        shell: bash
        run: bash build-installer.sh
      - name: Upload installer
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ShabpaSetup
          path: |
            installer/ShabpaSetup.exe
            installer/ShabpaSetup.exe.sha256
          if-no-files-found: error
      # Next step once SignPath approves the project: submit artifact id ${{ steps.upload.outputs.artifact-id }}
      # with signpath/github-action-submit-signing-request (organization id and API token come from repo secrets).
