name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Shabpa.slnx -c Release
      - name: Test
        run: dotnet test Shabpa.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"
