name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shabpa version
      description: Shown at the bottom of the sidebar.
      placeholder: "3.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
  - type: checkboxes
    id: admin
    attributes:
      label: Context
      options:
        - label: Shabpa was running as administrator
        - label: A game was running
