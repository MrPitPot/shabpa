# Mirrors .github/workflows/ci.yml for GitLab. Uses GitLab's shared Windows runners.
#
# Off by default: every push made a red "failed" pipeline with no jobs (GitLab.com only gives shared runners to
# verified accounts, and Windows runners need a paid plan).
# To turn it on (after verifying, or with your own runner tagged saas-windows-medium-amd64):
#   GitLab > Settings > CI/CD > Variables: SHABPA_CI = 1
stages: [build, test]

workflow:
  rules:
    - if: $SHABPA_CI == "1"
    - when: never

default:
  tags: [saas-windows-medium-amd64]

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

.dotnet:
  before_script:
    - Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
    - ./dotnet-install.ps1 -Channel 10.0 -InstallDir "$env:USERPROFILE\dotnet"

build:
  extends: .dotnet
  stage: build
  script:
    - $env:PATH = "$env:USERPROFILE\dotnet;$env:PATH"
    - dotnet build Shabpa.slnx -c Release
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  extends: .dotnet
  stage: test
  script:
    - $env:PATH = "$env:USERPROFILE\dotnet;$env:PATH"
    - dotnet test Shabpa.slnx -c Release --logger "trx;LogFileName=results.trx"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
